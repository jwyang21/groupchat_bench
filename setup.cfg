[flake8]
# PEP8 compliance policy (strict):
#   - The full standard PEP8 is enforced at zero violations, including
#     the strict 79-character line-length limit (max-line-length = 79).
#   - Structural checks (indentation E1xx, whitespace E2xx, blank lines
#     E3xx, imports E4xx, statements E7xx, line length E5xx) and the
#     pyflakes F-codes are all held at zero violations.
#   - Comments and docstrings comply with the 79-character limit too;
#     they are wrapped onto multiple lines rather than exceeding it.
max-line-length = 79
# E203: whitespace before ':' in slices (Black-compatible; PEP8-debated).
# W503: line break before binary operator (Black-preferred style).
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv

[pycodestyle]
max-line-length = 79
ignore = E203, W503
