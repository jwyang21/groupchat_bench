# GroupChat-Mem - example config demonstrating cache-model / QA-model
# separation (Friends, New Names, trial 0).
#
# The memory cache (relational records, query nodes, record embeddings) is
# loaded from one model's precomputed directory (memory.cache_llm_name), while
# QA is answered by a *different* model (the entry in `llms`). This lets a
# frontier model answer over an open model's precomputed cache without
# re-running the (expensive) cache-building pipeline.
#
# Here: cache = qwen3.5-35b-a3b-on (precomputed), QA = GPT-5.6 Terra.
# embedding_cache_readonly=true guarantees the source model's cache directory
# is never written to.
#
# Run:
#   PYTHONPATH=src python src/run/run_groupchat_mem.py \
#     --config configs/groupchat_mem/groupchat_mem.terra_qwencache.friends.newname.t0.yaml \
#     --method groupchat_mem --llms gpt-5.6-terra
#
# Authentication uses the OPENAI_API_KEY env var. OPENAI_API_KEY is also
# required for the OpenAI embeddings used in retrieval.

groupchat_mem:
  data:
    dataset_root: ./data/friends      # friends / bigbang / theoffice
    data_type: newname                # normal / newname (default) / shuffled
    trial: 0
    ie_type: openie
    normalization: raw
    per_llm_precomputed: true
    session_filter: all

  embedder:
    backend: openai
    model: text-embedding-3-small

  llms:
    - name: gpt-5.6-terra
      provider: openai
      model_name: gpt-5.6-terra
      base_url: <OPENAI_BASE_URL>     # e.g. https://api.openai.com/v1
      api_key: EMPTY                  # falls back to OPENAI_API_KEY env
      temperature: 1.0
      top_p: null                     # reasoning model: top_p unsupported -> omitted
      max_tokens: 16384
      extra_body:
        reasoning_effort: high
      extra_base_urls: []

  memory:
    name: groupchat_mem
    # --- Cache-model / QA-model separation ---
    cache_llm_name: qwen3.5-35b-a3b-on  # load the cache from this model's dir
    embedding_cache_readonly: true      # never write to the source cache dir
    num_records: 250
    num_sessions: 40
    num_query_nodes: 3
    hop: 2
    max_hop: 6
    session_method: alternating
    bm25_first: true
    record_format: record
    cos_sim_rerank: true
    record_embedding_type: temporal
    question_embedding_type: temporal
    fallback: true
    context_size: 0
    triple_normalization: raw
    question_format: multi_structured
    cache_budget: 6000
    delimiter: "========================================"

  grid_combos:
    - memory.num_records: 250
      memory.num_sessions: 40
      memory.num_query_nodes: 3

  qa:
    answer_budget: 10000

  run:
    seed: 42
    start_session_idx: 0
    end_session_idx: 9999
    result_dir: ./result/groupchat_mem_terra_qwencache/friends/t0
    log_prompts: true
    log_prompts_dir: ./log/groupchat_mem/prompts/friends/terra_qwencache_t0
    answer_max_workers: 16
