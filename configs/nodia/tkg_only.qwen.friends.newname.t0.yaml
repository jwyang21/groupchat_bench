# Example config: "tkg_only" retrieval (temporal knowledge graph quadruples only).
# Run with main.ablation_bridge_inverse.py --method tkg_hybrid_bridge_inverse --llms qwen3.5-35b-a3b-on.

tkg_hybrid_bridge_inverse:
  data:
    dataset_root: ./data/v1_3_1/friends
    data_type: newname
    trial: 0
    ie_type: openie
    normalization: raw
    per_llm_precomputed: true
    session_filter: all
  embedder:
    backend: openai
    model: text-embedding-3-small
  llms:
  - name: qwen3.5-35b-a3b-on
    provider: vllm
    model_name: qwen3.5-35b-a3b-on
    host: <VLLM_HOST>        # e.g. localhost or your vLLM server IP
    port: <VLLM_PORT>        # e.g. 8000
    api_key: EMPTY
    temperature: 1.0
    top_p: 0.95
    max_tokens: 15000
    extra_body:
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      chat_template_kwargs:
        enable_thinking: true
      thinking_token_budget: 10000
    extra_base_urls: []       # optional: additional vLLM endpoints for load-balancing
  memory:
    name: tkg_hybrid_bridge_inverse
    cache_budget: 6000
    q_subj_batch_workers: 8
    retrieval_method: tkg_only
    fallback: true
    hop: 2
    context_size: 0
    bm25_first: true
    rag_time_filter: false
    time_filter: false
    retrieve_by_timestamp: true
    rag_method: alternating
    num_retrieved: 0
    num_retrieved_tkg: 250
    num_retrieved_rag: 40
    enhanced_num_retrieved_tkg: 250
    enhanced_num_retrieved_rag: 40
    quad_format: quad
    reranker: none
    triple_normalization: raw
    question_format: multi_structured
    prompt_q_clf: q_clf.txt
    prompt_q_subj_idf: q_subj_idf.txt
    prompt_quad: qa_quad.txt
    prompt_rag: qa_rag.txt
    prompt_no_history: qa_no-history-eager.multi-structured.txt
    prompt_enhanced: qa_enhanced.txt
    num_q_subj_candidates: 3
    delimiter: ========================================
    cos_sim_rerank: true
    quad_embedding_type: temporal
    question_embedding_type: temporal
    rr_compress_tkg: 80
    rr_compress_rag: 12
    rr_entity_boost: 0.5
    rr_seed_boost: 0.5
    iter_bridge_k_hop: 6
    bridge_input_token_cap: 40000
    max_tries: 6
  grid_combos:
  - memory.retrieval_method: tkg_only
    memory.rag_method: alternating
    memory.num_retrieved_tkg: 250
    memory.num_retrieved_rag: 40
    memory.enhanced_num_retrieved_tkg: 250
    memory.enhanced_num_retrieved_rag: 40
    memory.num_q_subj_candidates: 3
  qa:
    answer_budget: 10000
  run:
    seed: 42
    start_session_idx: 0
    end_session_idx: 9999
    result_dir: ./result/v1_3_1_ablation_nodiacomp_tkg_only_k250_40/tkg_hybrid_bridge_inverse/friends/t0
    log_prompts: true
    log_prompts_dir: log/v1_3_1_ablation_nodiacomp_tkg_only_k250_40/prompts/friends/qwen_t0
    answer_max_workers: 16
