# Example config: Oracle (Records) upper bound. Friends, newname, trial 0, Qwen.
# Injects only the ground-truth records of each question's answer sessions.

data:
  dataset_root: ./data/friends
  data_type: newname
  trial: 0
  ie_type: openie
  normalization: raw
  per_llm_precomputed: false
llms:
- name: qwen3.5-35b-a3b-on
  provider: vllm
  model_name: qwen3.5-35b-a3b-on
  host: <VLLM_HOST>        # e.g. localhost or your vLLM server IP
  port: <VLLM_PORT>        # e.g. 8000
  api_key: EMPTY
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384
  extra_body:
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    chat_template_kwargs:
      enable_thinking: true
    thinking_token_budget: 10000
  extra_base_urls: []
embedder:
  backend: openai
  model: text-embedding-3-small
  cache: true
memory:
  name: oracle
  oracle_records_only: true
  oracle_record_llm: gt   # ground-truth records (required for record variants)
  oracle_dialogue_rank: time_ordered
  fallback: false
  question_format: multi_structured
  context_size: 0
  num_records: 0          # 0 = no truncation (all oracle evidence)
  num_sessions: 0
  record_format: record
  normalization: raw
  delimiter: ========================================
  prompt_sessions: qa_sessions.txt
  prompt_records: qa_records.txt
  prompt_dual: qa_dual.txt
run:
  seed: 42
  start_session_idx: 0
  end_session_idx: 9999
  session_filter: all
  commit_only: false
  log_prompts: true
  log_prompts_dir: log/oracle_records_only/prompts/friends.newname.t0.qwen3.5-35b-a3b-on
  answer_max_workers: 16
  result_save_every: 300
qa:
  answer_budget: 10000
