# Simple RAG (BM25) reference baseline. Friends, newname, trial 0, Qwen.
#   Run: PYTHONPATH=src python src/run/run_baseline.py \
#     --config configs/baselines/simple_rag_bm25.qwen.friends.newname.t0.yaml --llms qwen3.5-35b-a3b-on
# For the OpenAI Embedding variant, set memory.retriever: embedding.
# retriever=bm25 uses sparse lexical retrieval at QUERY time; the embedder below is still
# required (commit() builds the session index with a dialogue embedding regardless of retriever).

data:
  dataset_root: ./data/friends
  data_type: newname
  trial: 0
  per_llm_precomputed: false
llms:
  - name: qwen3.5-35b-a3b-on
    provider: vllm
    model_name: qwen3.5-35b-a3b-on
    host: <VLLM_HOST>
    port: <VLLM_PORT>
    api_key: EMPTY
    temperature: 1.0   # value actually used for the Simple RAG runs
    top_p: 0.95
    max_tokens: 16384
    extra_body:
      top_k: 20
      chat_template_kwargs:
        enable_thinking: true
      thinking_token_budget: 10000
    extra_base_urls: []
embedder:
  backend: openai
  model: text-embedding-3-small
memory:
  name: simple_rag
  retriever: bm25               # 'bm25' (sparse lexical) or 'embedding' (OpenAI Embedding)
  num_sessions: 40
  context_size: 0
  question_format: multi_structured
run:
  seed: 42
  start_session_idx: 0
  end_session_idx: 9999
  session_filter: all
  commit_only: false
  log_prompts: true
  log_prompts_dir: ./log/baseline/prompts/simple_rag_bm25.friends.newname.t0
  answer_max_workers: 16
qa:
  answer_budget: 10000
