# groupchat_qa - bundled default config (assets/configs/base.yaml)
# Runtime-immutable defaults. Per-experiment overrides live in the repo's
# top-level configs/*.yaml, which are merged on top of this file.

llm:
  provider: vllm
  model_name: qwen2.5-72b-unsloth         # must match the vLLM --served-model-name
  base_url: http://localhost:8000/v1      # OpenAI-compatible vLLM endpoint
  api_key: EMPTY
  system_prompt: "You are a helpful assistant."
  temperature: 0.0
  top_p: 0.95
  # Default output cap for short answers (e.g. multiple-choice letter, non-thinking models).
  # For thinking-enabled runs, set max_tokens: 16384 in the per-experiment config
  # (= reasoning budget 10000 + content headroom 6384); otherwise the reasoning trace is
  # truncated and the answer is cut off. The run script also auto-raises max_tokens to
  # (answer_budget + 6384) whenever a thinking_token_budget is configured, so per-experiment
  # configs that set answer_budget already get >=16384 even if this default is left at 1000.
  max_tokens: 1000

embedder:
  backend: openai                         # 'openai' or 'st'
  model: text-embedding-3-small

memory:
  name: groupchat_mem
  context_size: 0                         # 0 = unlimited (top-k bounds retrieval)
  hop: 2
  bm25_first: true
  session_time_filter: false
  record_format: record                   # 'record' or 'sentence'
  delimiter: "========================================"
  num_query_nodes: 3

eval:
  options: ["(A)", "(B)", "(C)", "(D)", "(E)"]

run:
  seed: 42
  # Legacy default (unused by the runtime); the effective output cap is llm.max_tokens above.
  # Same rule applies: use 16384 for thinking-enabled runs.
  num_max_tokens: 1000
