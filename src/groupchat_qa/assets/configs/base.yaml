# groupchat_qa — bundled default config (assets/configs/base.yaml)
# Runtime-immutable defaults. Per-experiment overrides live in the repo's
# top-level configs/*.yaml, which are merged on top of this file.

llm:
  provider: vllm
  model_name: qwen2.5-72b-unsloth         # must match the vLLM --served-model-name
  base_url: http://localhost:8000/v1      # OpenAI-compatible vLLM endpoint
  api_key: EMPTY
  system_prompt: "You are a helpful assistant."
  temperature: 0.0
  top_p: 0.95
  max_tokens: 1000

embedder:
  backend: openai                         # 'openai' or 'st'
  model: text-embedding-3-small

memory:
  name: tkg_hybrid
  context_size: 8000
  hop: 2
  bm25_first: true
  rag_time_filter: true
  quad_format: quad                       # 'quad' or 'sentence'
  delimiter: "========================================"
  num_q_subj_candidates: 3

eval:
  options: ["(A)", "(B)", "(C)", "(D)", "(E)"]

run:
  seed: 42
  num_max_tokens: 1000
